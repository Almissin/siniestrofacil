# perfil aws usado solo dentro de la lambda
# activar con SPRING_PROFILES_ACTIVE=aws desde serverless.yml
# usar base h2 en memoria porque mysql solo existe en el docker local
# considerar que los datos se pierden cada vez que la lambda se reinicia
spring.datasource.url=jdbc:h2:mem:siniestrofacil;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# usar la cola sqs que crea serverless.yml para publicar las denuncias nuevas
sqs.denuncias.url=${SQS_QUEUE_URL:}

# respetar el https de api gateway al armar urls por ejemplo en swagger
server.forward-headers-strategy=framework
