spring.application.name=ms-usuarios
server.port=8080
# abrir Swagger UI en la raiz (http://localhost:8080/)
springdoc.swagger-ui.use-root-path=true

# conexion a MySQL (base propia de este microservicio: siniestrofacil_usuarios)
# los valores despues de ":" se usan al ejecutar desde VS Code (MySQL en localhost)
# dentro de Docker se reemplazan con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/siniestrofacil_usuarios}
spring.datasource.username=${DB_USER:sfuser}
spring.datasource.password=${DB_PASSWORD:sfpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# crear o actualizar las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: la misma clave debe usarse en todos los microservicios (minimo 32 caracteres)
# dentro de Docker se reemplaza con la variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET:siniestrofacil-clave-secreta-desarrollo-jvy0101-2026}
# duracion del token: 2 horas
jwt.expiracion-ms=${JWT_EXPIRACION_MS:7200000}

# crea roles y usuarios de demostracion al iniciar (solo si no existen)
app.datos-demo.habilitado=${DATOS_DEMO:true}
